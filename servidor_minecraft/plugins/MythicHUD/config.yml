generate-default-files: true
generate-unicode-files: true
layout:
  default:
  - elpe_hud
  - elpe_hud_upper
check-update: 5
placeholder-update: 5
decimal-format: '#.##'
nexo-hook: true
copy-pack:
  enabled: false
  path: Nexo/pack/external_packs/MythicHud.zip
boss-bar:
  max: 7
  hud-position: 4
  color: yellow
disable-geyser-players: true
disable-netty-injection: false
hide-exp: false
hide-vanilla-hud: true
updaters:
  EXPERIENCE: true
  CONSUMING: true
  RESPAWNING: true
  ARMOR: true
  AIR: true
pack-support: all
default-namespace: mythichud
config-version: 11
