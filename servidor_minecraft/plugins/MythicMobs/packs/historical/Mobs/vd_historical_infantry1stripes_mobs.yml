vd_historical_infantry1stripes_mob_knightpike:
  Template: vd_historical_infantry1_template
  Display: Pikeman
  Health: 40
  Faction: Castille
  AITargetSelectors:
  - clear
  - players
  - irongolems
  - attacker
  - villagers
  - monsters
  - specificfaction{f=France}
  Skills:
  - model{modelid=vd_historical_infantry1stripes_mob_knight_pike;damagetint=true} @Self ~onSpawn
  - model{modelid=vd_historical_infantry1stripes_mob_knight_pike;damagetint=true} @Self ~onLoad
  - gcd{ticks=25} @self ~onSpawn
  - addtag{t=HasPike} @self ~onSpawn
  - sound{s=item.armor.equip_chain;p=0.9;v=0.3} @self ~onTimer:15 ?moving ?!hastag{t=HasSword}
  - sound{s=item.armor.equip_chain;p=0.9;v=0.3} @self ~onTimer:10 ?moving ?hastag{t=HasSword}
  - sound{s=item.armor.equip_chain;p=1.3;v=0.3} @self ~onDamaged
  - sound{s=item.armor.equip_netherite;p=1.3;v=0.3} @self ~onDamaged
  - sound{s=item.armor.equip_chain;p=1.3;v=0.3;delay=9} @self ~onDeath
  - sound{s=item.armor.equip_netherite;p=1.3;v=0.3;delay=9} @self ~onDeath
  - sound{s=block.heavy_core.place;p=1.3;v=0.6;delay=11} @self ~onDeath
  - effect:particles{particle=poof;amount=100;hS=0.5;vS=0.5;speed=0;delay=43} @SelfLocation{fo=1.5} ~onDeath
  - sound{s=entity.llama.step;p=1.5;v=0.3} @self ~onTimer:15 ?moving ?!hastag{t=HasSword}
  - sound{s=entity.llama.step;p=1.5;v=0.3} @self ~onTimer:10 ?moving ?hastag{t=HasSword}
  - setAI{ai=false} @self ~onSpawn
  - setAI{ai=true;delay=25} @self ~onSpawn
  - cancelevent @self ~onAttack
  - randomskill{s=InfantrySwordStab1 1, InfantrySwordCut1 1, InfantrySwordHit1 1, InfantryHealPotion 10, InfantrySwordCombo1 1} @self ~onTimer:1
  - state{state=damage} @Self ~onDamaged ?!hastag{t=HasPike}
  - metaskill{s=IdleVariation1} @Self ~onTimer:60 0.1 ?hastag{t=HasPike} ?!incombat
  - metaskill{s=InfantryTarget1} @Self ~onEnterCombat ?hastag{t=HasPike}
  - metaskill{s=InfantryTargetDrop1;delay=80} @Self ~onDropCombat ?hastag{t=HasPike}
  - metaskill{s=InfantryShieldAttack1} @Self ~onTimer:1 ?hastag{t=HasPike}
  - potion{type=WITHER;duration=120;level=4;hasparticles=false} @Children ~onDamaged ?!hastag{t=HasPike}
  - metaskill{s=InfantryPikeBreak} @Self ~onSignal:pikebreak
  - metaskill{s=InfantryShieldBreak} @Self ~onSignal:shieldbreak
  - goto{speedModifier=0;sh=1;sv=1} @target ~onTimer:5
  - totem{ch=5;i=4;md=2;oH=PikeHitDamage;drawhitbox=false;hr=0.4;vr=0.4;yo=0.3;hnp=true;hitConditions=[  - samefaction false  ]} @modelpart{mid=vd_historical_infantry1stripes_mob_knight_pike;pid=pike_attack_damage} ~onTimer:2 ?hastag{t=HasPike} ?hastag{t=Targeting}
  - bindHitbox{mid=vd_historical_infantry1stripes_mob_knight_pike;p=b_shield;t=vd_historical_infantry1stripes_mob_knightpike_shieldhitbox} @self ~onSpawn
  - bindHitbox{mid=vd_historical_infantry1stripes_mob_knight_pike;p=b_pike_hitbox3;t=vd_historical_infantry1stripes_mob_knightpike_spearhitbox} @self ~onSpawn



