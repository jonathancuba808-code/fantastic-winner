netherman: 
  Type: HUSK
  Display: 'Netherman'
  Health: 50
  Damage: 1
  Faction: NetherMob
  AIGoalSelectors:
  - clear
  - meleeattack
  - randomstroll
  - randomlookaround
  - lookatplayers
  AITargetSelectors:
  - clear
  - attacker
  - players
  Options:
    PreventOtherDrops: true
    Silent: true
    KnockbackResistance: 0.8
    FollowRange: 64
    MovementSpeed: 0.3
    Collidable: true
  Modules:
    ThreatTable: true
  Skills:
  - model{mid=netherman;n=false;step=2} @self ~onSpawn
  - model{mid=netherman;n=false;step=2} @self ~onLoad
  - look{headOnly=true;immediately=true} @target ~onTimer:1
  - randomskill{s=netherman_scream,netherman_swipe} ~onTimer:10
  - sound{s=entity.polar_bear.hurt;p=0.9;v=1} @ self ~onDamaged
  - sound{s=entity.strider.ambient;p=0.7;v=1} @self ~onTimer:120to140
  - setspeed{t=walking;s=1} @self ~onDropCombat
  - setspeed{t=walking;s=1.5} @self ~onEnterCombat
  - cancelevent{sync=true} ~onAttack


