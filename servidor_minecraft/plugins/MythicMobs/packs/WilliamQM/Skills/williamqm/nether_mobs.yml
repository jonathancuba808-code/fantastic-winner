
netherman_scream:
  Cooldown: 2to4
  Conditions:
  - targetwithin{d=10} true
  - targetnotwithin{d=1} true
  - offgcd true
  Skills:
  - state{s=scream} @self
  - runaigoalselector{goal=clear}
  - setspeed{t=walking;s=0} @self
  - gcd{t=40}
  - delay 10
  - sound{s=entity.enderman.scream;p=1;v=1} @self
  - delay 5
  - projectile{oT=scream_tick;oH=scream_hit;v=20;i=1;sB=false;sE=false;hnp=true;mr=16} @forward{a=16;uel=true}
  - delay 8
  - runaigoalselector{goal=meleeattack}
  - runaigoalselector{goal=randomstroll}
  - runaigoalselector{goal=randomlookaround}
  - runaigoalselector{goal=lookatplayers}
  - setspeed{t=walking;s=1} @self
scream_tick:
  Skills:
  - effect:particles{p=sonic_boom;amount=1;speed=0;hS=0;vS=0} @origin
scream_hit:
  Skills:
  - delay 10
  - potion{type=SLOW;duration=60;level=2} @EIC{a=130;r=16}
  - damage{a=2;pi=true;ii=true}
  - delay 3
  - damage{a=2;pi=true;ii=true}
  - delay 3
  - damage{a=2;pi=true;ii=true}

