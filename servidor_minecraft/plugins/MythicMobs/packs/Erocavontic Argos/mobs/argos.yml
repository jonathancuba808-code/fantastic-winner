ero_argos:
  Type: iron_golem
  Display: '&cArgos'
  Health: 1000
  Damage: 30
  Armor: 15
  Faction: Boss
  Modules:
    ThreatTable: true
    ImmunityTable: true
  Options:
    AlwaysShowName: true
    NoDamageTicks: 0
    MovementSpeed: 0.3
    KnockbackResistance: 1
    MaxCombatDistance: 45
    FollowRange: 45
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventItemPickup: 
    Silent: true
    PreventOtherDrops: true
    Despawn: false
    Scale: 0.1
  Variables:
    shootC: 0
  BossBar:
    Enabled: true
    Title: '&cArgos'
    Range: 50
    Color: RED
    Style: SOLID
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookAtTarget{r=45;h=true}
  AITargetSelectors:
  - clear
  - players
  Skills:
  - CancelEvent{sync=true} ~onAttack
  - CancelEvent{sync=true} ~onDamaged ?hasaura{n=onSpawn}
  - CancelEvent{sync=true} ~onDamaged ?hasaura{n=onBossDown} ?healthpercent{p=<15%}
  - Aura{auraName=onSpawn;time=70;i=1;oS=[ 
      - gcd{t=70} @self 
      - skill{s=ero_stopEntityBoss_argos;sync=true;durations=70} @self
    ]} @self ~onSpawn
  - skill{s=ero_argos_state_1_nAttack;sync=true} @self ~onAttack
  - skill{s=ero_argos_state_2_nAttack;sync=true} @self ~onAttack
  - throw{v=5;vy=0} @PlayersInRadius{r=1.8} ~onTimer:3 ?!hasaura{n=removeHitbox}
  
  - skill{s=ero_argos_state_2_down;sync=true} @self ~onTimer:20 ?healthpercent{p=>70%} ?hastag{t=state_2}
  - skill{s=ero_argos_state_1_nAttack;sync=true} @self ~onTimer:40 ?playersinradius{a=>0;r=4} ?!healthpercent{p=<40%} ?!hastag{t=state_2}
  - skill{s=ero_argos_state_2_nAttack;sync=true} @self ~onTimer:40 ?playersinradius{a=>0;r=4} ?hastag{t=state_2}
  
  - skill{s=ero_argos_state_1_spawn;sync=true} @self ~onSpawn 
  - skill{s=ero_argos_state_1_spawn;sync=true} @self ~onLoad 

  - skill{s=ero_argos_state_2_spawn;sync=true} @self ~onSpawn
  - skill{s=ero_argos_state_2_spawn;sync=true} @self ~onLoad

  - skill{s=ero_argos_state_1_skill_attack_ran;sync=true} @target ~onTimer:5
  - skill{s=ero_argos_state_2_skill_attack_ran;sync=true} @target ~onTimer:5 

  - skill{s=ero_argos_change_state;sync=true} @self ~onTimer:10 ?!hastag{t=state_2} ?healthpercent{p=<40%}
  - CancelEvent{sync=true} ~onDamaged ?!hastag{t=state_2_on} ?healthpercent{p=<40%}

  - skill{s=ero_argos_state_2_death;sync=true} @self ~onDeath

