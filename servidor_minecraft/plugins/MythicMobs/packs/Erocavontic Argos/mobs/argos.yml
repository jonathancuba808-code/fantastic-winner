ero_vfx_rz:
  Type: block_display
  DisplayOptions:
    Block: AIR
  Faction: vfx
  Skills:
  - CancelEvent{sync=true} ~onDamaged
  - skill{s=[
      - model{mid=ero_vfx_red_zone;n=false;scale=1;radius=150} @self
      - brightness{b=15;s=15} @self
      - remove{delay=90;sync=true} @self
      - skill{s=[
          - sound{s=entity.warden.sonic_boom;p=1.00;v=1.0} @self
          - sound{s=entity.warden.sonic_boom;p=1.40;v=1.0} @self
          - sound{s=item.trident.thunder;p=1.40;v=1.0} @self
          - sound{s=entity.iron_golem.damage;p=0.70;v=1.0} @self
        ];sync=true;delay=50} @self
      - skill{s=[
          - sound{s=entity.warden.sonic_charge;p=2.00;v=1.0}
          - sound{s=entity.warden.sonic_charge;p=1.55;v=1.0}
        ];sync=true;delay=30} @self
      - delay 60
      - sudoskill{s=[
          - totem{yo=0.5;md=2;oS=[
              - effect:explosion
              - effect:particles{particle=Explosion;speed=0;Size=1.5;a=2;hS=0.1;vS=0.1}
              - effect:particles{particle=Lava;speed=0.15;Size=1;a=15;hS=1.4;vS=0.75;y=0.5} 
              - skill{s=[
                  - damage{a=<caster.damage> * 2}
                  - delay 1
                  - throw{v=7;vy=1;fo=true}
                ];sync=true} @EntitiesNearOrigin{r=3.2}
            ]} @trigger
        ];cat=true;repeat=2;repeatInterval=5} @MobsInRadius{r=50;types=ero_argos}
    ];sync=true;delay=<random.0to40>} @self ~onSpawn

