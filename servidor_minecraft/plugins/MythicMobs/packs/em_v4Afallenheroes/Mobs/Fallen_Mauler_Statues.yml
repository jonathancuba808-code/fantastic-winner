statue_fallenMauler_em_generic:
  Type: vindicator
  Display: ''
  Health: 30
  Faction: FallenHero
  AIGoalSelectors:
  - 0 clear
  DamageModifiers:
  - FIRE 0
  - MAGIC 2.7
  - PROJECTILE 0.6
  Drops:
  Damage: 10
  Skills:
  - model{mid=fallen_mauler_statue;damagetint=false;initrender=false} @self ~onSpawn
  - model{mid=fallen_mauler_statue;damagetint=false;initrender=false} @self ~onLoad
  - bodyclamp{m=statue_fallenMauler_em;c=360;delay=1} @self ~onSpawn
  - cancelEvent{sync=true} ~onAttack
  - stance{stance=statue} @self ~onSpawn
  
  - sound{s=emaginationfallenheroes:custom.fallenhero.hitmetal;p=1;v=1} @selflocation ~onDamaged 1 ?!damagecause{c=PROJECTILE}
  - sound{s=emaginationfallenheroes:custom.fallenhero.hitmetal;p=1.6;v=1} @selflocation ~onDamaged 1 ?damagecause{c=PROJECTILE}
  - skill{s=[
    - sound{s=emaginationfallenravager:custom.fallenravager.statuefall;p=1;v=1.5} @selflocation
    - model{mid=fallen_mauler_statue;remove=true;killowner=false;delay=2} @self
    - bodyclamp{m=statue_fallenMauler_em;c=0} @self
    - summon{mob=statue_fallenMauler_em_death;amount=1;noise=0;r=0;yr=0} @SelfLocation];sync=true} @Self ~onDeath
  Options:
    ApplyInvisibility: true
    Silent: true
    AlwaysShowName: false
    MovementSpeed: 0.01 #0.27
    Interactable: true
    Invincible: false
    NoGravity: false
    NoAi: false
    FollowRange: 2
    KnockbackResistance: 1
    PreventOtherDrops: true

statue_fallenMauler_em_n:
  Template: statue_fallenMauler_em_generic
  Display: ''
  Skills:
  - setrotation{relative=false;pitch=0;yaw=180} @Self ~onSpawn
  - spin{auraName=spin;d=9999999;v=0} @self
  - renderinit{mid=fallen_mauler_statue} @self ~onSpawn

