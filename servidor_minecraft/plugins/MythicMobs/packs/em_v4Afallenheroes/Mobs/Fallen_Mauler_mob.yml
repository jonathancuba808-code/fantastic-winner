      - changepart{m=fallen_mauler;pid=hip;nm=fallen_mauler2;npid=hip} @self 
      - changepart{m=fallen_mauler;pid=chest;nm=fallen_mauler2;npid=chest} @self 
      - changepart{m=fallen_mauler;pid=left_leg;nm=fallen_mauler2;npid=left_leg} @self 
      - changepart{m=fallen_mauler;pid=left_shin;nm=fallen_mauler2;npid=left_shin} @self 
      - changepart{m=fallen_mauler;pid=shield;nm=fallen_mauler2;npid=shield} @self 
      - changepart{m=fallen_mauler;pid=right_weapon;nm=fallen_mauler2;npid=right_weapon} @self 
      - changepart{m=fallen_mauler;pid=right_leg;nm=fallen_mauler2;npid=right_leg} @self 
      - changepart{m=fallen_mauler;pid=right_shin;nm=fallen_mauler2;npid=right_shin} @self ]} ~onSpawn
  
