
fallenMauler_em:
  Template: fallenMauler_em_activated
  Display: 'Fallen Mauler'

fallenMauler_em_activated:
  Template: fallenMauler_em_generic
  Display: 'Fallen Mauler'
  Skills:
  - setvariable{var=caster.statueform;value="0";t=integer} @Self ~onSpawn #=====================
  - setvariable{var=caster.eichpee;value="<caster.mhp>";t=float} @Self ~onSpawn
  - skill{s=fallenMauler_em_hp_check;cooldown=99999;sync=true;delay=1} @PlayersInRadius{r=60} ~onSpawn
  - renderinit{mid=fallen_mauler} @self ~onSpawn
  - renderinit{mid=fallen_mauler} @self ~onLoad
  - DefaultState{type=WALK;state=walk_combat} @self ~onEnterCombat
  - DefaultState{type=IDLE;state=idle_combat} @self ~onEnterCombat
  - DefaultState{type=WALK;state=walk} @self ~onDropCombat
  - DefaultState{type=IDLE;state=idle} @self ~onDropCombat
  - setspeed{speed=1.5;type=walking} @Self ~onDropCombat
  - propel{v=0.04;repeat=1;repeati=1} @forward{f=2;y=-3} ~onDropCombat
  - setspeed{speed=2.15;type=walking} @Self ~onEnterCombat ?!variableEquals{var=caster.parrying;value="1"}
  - setspeed{speed=1.5;type=walking} @Self ~onEnterCombat ?variableEquals{var=caster.parrying;value="1"} 
  
  - Aura{auraName=backstepdodgerfallenMauler_em;onTick=fallenMauler_em_bstpcheck;interval=7;duration=99999} @self ~onSpawn
  - setstance{stance=normal} @self ~onSpawn


