
fallenMauler_em_hp_check:
  Conditions:
  - playersinradius{a=>1;r=60} orElseCast fallenMauler_em_hp_checkB
  Skills:
  - skill{s=fallenMauler_em_hp_checkB} @pir{r=100} #MODIFY THE RANGE TO CHECK FOR PLAYERS
fallenMauler_em_hp_checkB:
  Conditions:
  Skills:
  - setvariable{var=skill.amount_targets;val=<skill.targets>}
  - setmaxhealth{amount=<caster.var.eichpee>+(15*<skill.var.amount_targets>);mode=SCALE} @self


