######### Neutral Mobs (More in Expansion Pack) ############

qmob_shulkrab:
  Type: WOLF
  Display: 'Shulkrab'  # change this if you want
  Faction: shulkrabs
  Modules:
    ThreatTable: true
  AIGoalSelectors:
  - clear
  - meleeattack
  - movetowardstarget
  - randomlookaround
  - lookatplayers
  - randomstroll
  AITargetSelectors:
  - clear
  - hurtbytarget
  - nearestconditionaltarget{mr=true;ms=true;conditions=[ - mythicmobtype{t=qmob_endermite} true ]} # makes it want to attack nearby endermites
  Health: 60 # change this if you want
  Damage: 0 # keep this 0
  Armor: 12.0 # whatever you want
  Options:
    Despawn: false
    Silent: true
    PreventOtherDrops: true
    FollowRange: 20
    MovementSpeed: 0.215
    Tameable: false
    KnockbackResistance: 1.0
  Drops: # put stuff here
  - SHULKER_SHELL 1 1 # always drops shulker shells, adjust to your liking
  - exp 9to14
 # - qitem_endessence 1 0.03 # 3% chance of dropping essence of the end                # enable if you have the items expansion
  DamageModifiers:
  - PROJECTILE 0.5 # takes less damage from projectiles
  - FIRE 0.5 # takes less damage from fire
  Skills:
  ####### Misc
  - model{mid=qmob_shulkrab;scale=<random.float.1.65to1.95>;save=true} @self ~onSpawn # random size 
  - defaultstate{t=walk;s=walk;sp=0.9} @self ~onSpawn           #
  - defaultstate{t=idle;s=idle;sp=0.7} @self ~onSpawn           # these slow down the animation since it's a bigger mob
  - defaultstate{t=death;s=death;sp=0.7} @self ~onSpawn         #
  ####### Stances/AI/Abilities
  - potionclear{type=LEVITATION} @self ~onTimer:20
  - potion{t=SLOW_FALLING;d=22;l=1;p=false} @self ~onTimer:20
 # - mountmodel{mode=walking;driver=true} @trigger ~onInteract # unused mount
  - CancelEvent{sync=true} @self ~onInteract # tries to stop the vanilla bone taming
  - CancelEvent{sync=true} @self ~onAttack # replaces vanilla attack
  - randomskill{s=shulkrabAttack 2, shulkrabBonkAttack 2;delay=<random.0to10>} @self ~onTimer:75 0.5 ?targetwithin{d=7}
  - randomskill{s=shulkrabAttack 2, shulkrabBonkAttack 2;delay=<random.0to10>} @self ~onAttack
  - skill{s=shulkrabHide;delay=<random.0to60>} @self ~onHurt 0.45 ?!stance{s=hiding} # makes it wanna hide when being attacked
  - skill{s=shulkrabProtect;sync=true} @self ~onHurt ?stance{s=hiding} # invulnerable while in shell
  ########### FX
  - skill{s=shulkrabAmbient;delay=<random.0to100>} @self ~onTimer:140 0.6
  - skill{s=shulkrabHurt} @self ~onHurt ?!stance{s=hiding}
  - skill{s=shulkrabDeath} @self ~onDeath


