ero_stopEntity:
  Skills:
  - potion{t=SLOW;d=<skill.durations>+5;l=254;force=true;p=false;i=false} @self
  - attribute{attribute=GENERIC_KNOCKBACK_RESISTANCE;a=100;duration=<skill.durations>+5} @self
