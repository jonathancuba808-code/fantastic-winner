ero_spider_shoot:
  Cooldown: 5.5
  Conditions:
  - offgcd
  TargetConditions:
  - fieldofview{angle=45}
  Skills:
  - gcd{t=60}
  - skill{s=ero_stopEntity;sync=true;durations=60} @self
  - look{headOnly=true;immediately=false}
  - setcollidable{c=false} @self
  - state{s=shoot;speed=1} @self
  - sound{s=entity.wither.shoot;p=1.5;v=1;delay=28} @self
  - skill{s=[
      - projectile{oT=[
          - effect:particles{particle=Snowflake;speed=0.01;Size=0.1;a=2;hS=0.1;vS=0.1}
        ];oH=[
          - skill{s=ero_spider_shoot_hook;sync=true}
          - sudoskill{s=[ - pull{v=10;fo=true;Origin=@SelfLocation{y=-10};delay=1} @self]}
          - skill{s=[- damage{a="<caster.damage>"}];sync=true}
          - skill{s=ero_spider_shoot_target;sync=true}
        ];oE=[
          - summon{t=ero_spider_cobweb;onsummon=[ - sudoskill{s=[ - remove{delay=100} @self ];cat=true}]} @TargetedLocation{Conditions=[ - distance{d=>9} false ]}
        ];v=<random.18to25>;sfo=0;syo=0;i=1;hR=0.55;TargetYOffset=-0.65;hnp=true;mr=99;g=0.2;fo=true;Origin=@ModelPart{p=shoot}} @Forward{f=99;y=0.5}
    ];sync=true;delay=30}

ero_spider_attack:
  Cooldown: 1
  Conditions:
  - offgcd
  TargetConditions:
  - distance{d=<2.5}
  Skills:
  - gcd{t=15} @self
  - sound{s=minecraft:entity.spider.hurt;p=1;v=1} @self
  - skill{s=ero_stopEntity;sync=true;durations=15} @self
  - look{headOnly=true;immediately=false} @self
  - state{s=attack;speed=1} @self
  - damage{a="<caster.damage>";delay=10}

ero_spider_shoot_target:
  TargetConditions:
  - distance{d=>9} false
  Skills:
  - summon{t=ero_spider_cobweb;onsummon=[ - sudoskill{s=[ - remove{delay=100} @self];cat=true}]}

ero_spider_shoot_hook:
  TargetConditions:
  - distance{d=>9}
  Skills:
  - pull{v=5;fo=true;repeat=19;repeatInterval=1}
  - delay 20
  - potion{t=WEAKNESS;d=100;l=2}
  - summon{t=ero_spider_cobweb;onsummon=[ - sudoskill{s=[ - remove{delay=160} @self - addtag{t=lock} @self];cat=true}];a=4;r=1}

ero_spider_idle_set:
  Conditions:
  - incombat orElseCast ero_spider_idle_set2
  Skills:
  - Aura{auraName=combat;onStart=[
      - auraremove{n=n_combat;s=99} @self
      - defaultstate{type=idle;state=idle} @self ?hasaurastacks{n=combat;s=1}
    ];time=60;i=1;ms=2} @self

ero_spider_idle_set2:
  Conditions:
  - hasaura{n=combat} false
  Skills:
  - Aura{auraName=n_combat;onStart=[
