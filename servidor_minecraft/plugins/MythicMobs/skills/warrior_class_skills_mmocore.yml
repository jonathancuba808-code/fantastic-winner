warrior_rage:
  Conditions:
  - healthpercent{p=<30%} true # Change the % value of this if you want the passive to activate on a healthpercentage to your liking!
  Skills:
  - sound{s=warrior.rage} @self
  - potion{type=DAMAGE_RESISTANCE;duration=160;level=1;hasParticles=false} @self # Change the duration in this line if you want to change the duration of the resistance buff
  - potion{type=SPEED;duration=160;level=1;hasParticles=false} @self # Change the duration in this line if you want to change the duration of the speed buff
  - particles{p=dust_color_transition;color1=#ff952e;color2=#ff3700;amount=1;hS=0.3;vS=0.3;y=0.4;size=0.75;speed=0;repeat=60;repeati=1} @self
  - summon{type=vfx_warrior_rage_dust;amount=1;radius=0;yRadius=0;onSurface=false} @selflocation
  - orbital{auraName=vfx_warrior_rage;bulletType=MOB;mob=vfx_warrior_rage;hr=1;vr=1;hp=false;hnp=false;r=0;duration=20;oy=1;rx=0;ry=0;rz=0;avx=0;avy=0;avz=0} @self
  - throw{velocity=15;velocityY=2} @EIR{r=5}
  - skill{s=warrior_shockwave_effect_small} @self
  
