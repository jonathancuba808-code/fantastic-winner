vfx_warrior_furiousslash1:
  Type: block_display
  DisplayOptions:
    Block: AIR
    Billboard: FIXED
  Options:
    Invincible: true
    Collidable: false
  Skills:
  - model{usestatemachine=true;mid=warrior_furiousslash1;lockpitch=true;scale=1} @self ~onSpawn
  - brightness{mid=warrior_furiousslash1;b=15;s=15} @self ~onSpawn
  - BodyRotation{playermode=false;stable=0;rdelay=0;rduration=0} @self ~onSpawn
  - remove{delay=11} @self ~onSpawn
  
