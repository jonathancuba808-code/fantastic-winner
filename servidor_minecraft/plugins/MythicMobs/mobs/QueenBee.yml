QueenBee:
  Type:  ZOMBIE
  Drops:
  - exp 100-140 1
  - queenbeeitems:stingspear_part 1-3 1
  - queenbeeitems:stingblade_part 1-2 1
  DamageModifiers:
  - FALL -1
  BossBar:
    Enabled: true
    Title: 'Queen Bee'
    Range: 30
    Color: WHITE
  Health: 300
  Modules:
    ThreatTable: true
  DamageModifiers:
  - PROJECTILE 0.10
  KillMessages:
  - '<target.name> was slain by Queen Bee'
  AIGoalSelectors:
    - meleeattack{attackReach=6}
    - goToSpawn{speed=1;max=15;min=10;dt=false}
  AITargetSelectors:
    - clear
    - players
  Skills:
  - skill{s=QueenBeeSpawn} @self ~onSpawn
  - skill{s=QueenBeeSpawnEF} @self ~onSpawn
  - model{mid=QueenBee;damagetint=false} @self ~onSpawn
  - skill{s=QueenBeeDeath} @self ~onDeath
  - skill{s=SummonBee} @self ~onDamaged
  - skill{s=[
            - cancelEvent
            - skill{s=QueenBeeAttack}
            ];sync=true} @NearestPlayer{r=5} ~onAttack
  Options:
    Despawn: false
    MovementSpeed: 0.25
    Silent: true
    MaxCombatDistance: 25
    KnockbackResistance: 1
    PreventSunburn: true
    PreventOtherDrops: true
    PreventBlockInfection: true
    Collidable: true
    
