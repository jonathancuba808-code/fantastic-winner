- '  &7⋆ &f/axkoth start <KOTH> &7| &#FFAA66Start koth'
- '  &7⋆ &f/axkoth stop <KOTH> &7| &#FFAA66Stop koth'
- '  &7⋆ &f/axkoth stopall &7| &#FFAA66Stop all running koths'
- '  &7⋆ &f/axkoth editor <KOTH> &7| &#FFAA66Open GUI editor'
